<div class="welcome-container">
  <!-- Logo / студия -->
  <div class="welcome-brand">
    <img src="logo.png" alt="Golden Hare Games" class="welcome-logo" />
    <p class="welcome-studio">Golden Hare Games</p>
  </div>

  <!-- Title -->
  <h1 class="welcome-title">Добро пожаловать!</h1>
  <p class="welcome-subtitle">«Твой герой: послание дня»</p>

  <!-- Info card with disclaimer -->
  <div class="disclaimer-card">
    <p class="disclaimer-text">
      Наше приложение создано для развлечения. Все ответы генерируются случайным образом. Они не являются финансовыми,
      юридическими или медицинскими советами. Приложение не несет ответственности за ваши жизненные решения.
    </p>
  </div>

  <!-- Checkbox row -->
  <label class="checkbox-row">
    <span class="checkbox-custom">
      <input
        type="checkbox"
        class="checkbox-native"
        (change)="onCheckboxChange($event)"
        [checked]="isChecked"
      />
      <span class="checkbox-visual" [class.checkbox-checked]="isChecked">
        <svg *ngIf="isChecked" class="checkmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </span>
    </span>
    <span class="checkbox-label">
      Я принимаю условия
      <a class="terms-link" (click)="openTerms($event)">Пользовательского соглашения,</a>
      подтверждаю, что я понимаю исключительно развлекательный характер приложения.
    </span>
  </label>

  <!-- Enter button -->
  <button
    class="enter-button"
    [disabled]="!isChecked"
    (click)="enterApp()"
  >
    Войти
  </button>
</div>

<!-- Terms Modal -->
<app-terms-modal
  *ngIf="showTermsModal"
  (close)="closeTerms()"
></app-terms-modal>
