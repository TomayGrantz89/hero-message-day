<div class="shop-container">
  <h1 class="shop-title">Магазин</h1>

  <div class="product-card">
    <h2 class="product-name">Полная коллекция карт</h2>
    <p class="product-description">
      Разблокируйте все карты коллекции и получите доступ к полному набору функций.
    </p>

    <button
      class="buy-button"
      (click)="onBuyClick()"
      [disabled]="isProcessing"
    >
      {{ isProcessing ? 'Обработка...' : 'Купить' }}
    </button>

    <p class="terms-disclaimer">
      Нажимая кнопку, вы принимаете условия
      <a class="terms-link" (click)="openTerms($event)">Пользовательского соглашения</a>
      и соглашаетесь со стоимостью услуги. После открытия контента возврат средств невозможен.
    </p>

    <button
      class="restore-button"
      (click)="onRestoreClick()"
      [disabled]="isProcessing"
    >
      {{ isProcessing ? 'Обработка...' : 'Восстановить покупки' }}
    </button>
  </div>
</div>

<!-- Terms Modal -->
<app-terms-modal
  *ngIf="showTermsModal"
  (close)="closeTerms()"
></app-terms-modal>
