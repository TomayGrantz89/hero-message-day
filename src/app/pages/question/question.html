<div class="question-container">
  <!-- Single fixed-height plaque: always rendered so the layout never jumps
       when the instruction text is replaced by the answer text. -->
  <div class="oracle-plaque">
    <span class="plaque-text" *ngIf="!lastAnswer">{{ bannerText }}</span>
    <span class="plaque-text answer" *ngIf="lastAnswer">{{ lastAnswer }}</span>
  </div>

  <div class="question-content">

    <!-- Character image -->
    <div class="character-section">
      <img src="assets/ui/cold.png" alt="Персонаж" class="character-image" />
    </div>

    <!-- Button section: shows either timer block or ask button -->
    <div class="button-section">
      <!-- Timer block: shown when non-premium user has 0 attempts -->
      <div class="timer-block" *ngIf="showTimer">
        <span class="timer-label">До новой попытки:</span>
        <span class="timer-value">{{ timer }}</span>
      </div>

      <!-- Ask button: shown when user has attempts or is premium -->
      <button class="rainbow-btn" *ngIf="!showTimer" (click)="askQuestion()" [disabled]="!hasAttempt">
        Узнать ответ
      </button>
    </div>

  </div>
</div>
