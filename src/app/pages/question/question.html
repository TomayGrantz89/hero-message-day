<div class="question-container">
  <!-- Fixed home icon (top-left) -->
  <a routerLink="/" class="fixed-home-link">
    <img src="assets/ui/gate.png" alt="Home" class="home-icon">
  </a>

  <!-- Fixed premium button/status (top-right) -->
  <ng-container *ngIf="isPremium; else premiumButton">
    <span class="premium-status">
      <img src="/assets/ui/star.png" alt="★" class="premium-star" />
      Премиум-доступ
    </span>
  </ng-container>
  <ng-template #premiumButton>
    <button class="premium-btn" (click)="purchasePremium()">
      <img src="/assets/ui/star.png" alt="★" class="premium-icon" />
      <span>Купить премиум</span>
    </button>
  </ng-template>

  <div class="question-content">

    <p class="instruction">Задайте вопрос, на который можно ответить «Да» или «Нет», и нажмите на волшебный шар.</p>

    <div class="card-area">
      <div class="magic-image-wrapper" (click)="askQuestion()" [class.disabled]="!hasAttempt">
        <img src="/assets/ui/magic.png" alt="Задать вопрос" class="magic-image" />
        <!-- <div class="attempt-overlay" *ngIf="!hasAttempt">
          <span class="no-attempt">Нет попыток</span>
        </div> -->
      </div>
    </div>

    <div class="beautiful-answer" *ngIf="currentAnswer">
      <div class="beautiful-answer-title">Ответ:</div>
      <div class="beautiful-answer-text">{{ currentAnswer }}</div>
    </div>

    <div class="attempts-info">
      <div class="info-box">
        <span class="info-text">Вопросов на сегодня: <strong>{{ remainingQuestions }} / {{ maxQuestions }}</strong></span>
        <span class="info-detail" *ngIf="!isPremium">Бесплатный пользователь может задать только один вопрос в день.</span>
      </div>
    </div>

    <!-- <div class="actions">
      <button class="btn btn-reset" (click)="resetQuestion()" [disabled]="!currentAnswer">
        Сбросить ответ
      </button>
    </div> -->
  </div>
</div>
