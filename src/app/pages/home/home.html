<div class="home-container">
  <app-top-bar [showHomeIcon]="false" (premiumPurchased)="onPremiumPurchased()"></app-top-bar>

  <h1>Карта дня</h1>
  <p>Получите предсказание на сегодня и собирайте коллекцию карт.</p>

  <div class="button-group">
    <a routerLink="/collection" class="btn btn-collection">
      Коллекция
    </a>
    <a routerLink="/prediction" class="btn btn-prediction">
      Получить предсказание
    </a>
    <a routerLink="/question" class="btn btn-question">
      Оракул
    </a>
  </div>

  <div *ngIf="!isPremium" class="info">
    <div>
      <p>Ежедневно вы можете получить одну карту бесплатно. Вторую — посмотрев рекламу.</p>
      <p>Доступно только 14 карт из 64.</p>
    </div>
  </div>
</div>
