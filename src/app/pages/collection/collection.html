<div class="collection-container">
  <app-top-bar (premiumPurchased)="onPremiumPurchased()"></app-top-bar>

  <header class="header">
    <h1>Коллекция карт</h1>
    <div class="stats" *ngIf="isPremium">
      <div>Получено: {{ getCollectedCount() }} / {{ totalCards }}</div>
    </div>
  </header>

  <main class="main">
    <div class="grid" *ngIf="!showDetail">
      <div class="card-item" [class.card-item--locked]="!item.owned" [class.card-item--owned]="item.owned"
        *ngFor="let item of paginatedCards" (click)="selectCard(item)">
        <div class="card-image" *ngIf="item.owned" [style.backgroundImage]="'url(' + item.card.imageUrl + ')'"></div>
      </div>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination-container" *ngIf="totalPages > 1 && !showDetail">
      <div class="pagination">
        <div class="page-numbers">
          <button *ngFor="let page of pageNumbers" class="page-btn" [class.active]="page === currentPage"
            (click)="goToPage(page)">
            {{ page }}
          </button>

          <span class="ellipsis" *ngIf="totalPages > pageNumbers[pageNumbers.length - 1] + 1">...</span>

          <button *ngIf="totalPages > pageNumbers[pageNumbers.length - 1]" class="page-btn"
            [class.active]="totalPages === currentPage" (click)="goToPage(totalPages)">
            {{ totalPages }}
          </button>
        </div>
      </div>
    </div>

    <!-- Detail View - Enlarged Card -->
    <div class="enlarged-card-overlay" *ngIf="showDetail && selectedCard" (click)="closeDetail()">
      <div class="enlarged-card-container" (click)="$event.stopPropagation()">
        <div class="enlarged-card" (click)="flipDetail()" [class.flipped]="detailSide === 'back'">
          <div class="enlarged-card-face">
            <div class="enlarged-card-image" [style.backgroundImage]="'url(' + selectedCard.imageUrl + ')'"></div>
            <div class="enlarged-card-name">{{ selectedCard.name }}</div>
          </div>
          <div class="enlarged-card-back">
            <div class="enlarged-card-info">
              <h3>История</h3>
              <p>{{ selectedCard.story }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">

    <!-- Premium benefits section - shown only for non-premium users -->
    <!-- <div class="premium-benefits" *ngIf="!isPremium">
      <h2 class="premium-title">⭐ Премиум-преимущества:</h2>
      <ul class="premium-list">
        <li>2 попытки в день (без рекламы)</li>
        <li>Доступ ко всем 50 картам</li>
        <li>Нет рекламы</li>
        <li>Карты добавляются в вашу коллекцию автоматически.</li>
      </ul>
    </div> -->
  </footer>
</div>
