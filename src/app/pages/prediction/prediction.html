<div class="prediction-container">
  <main class="main">
    <!-- <p class="subtitle">{{'Откройте карту и узнайте предсказание на сегодня'}}</p> -->

    <!-- Unified action area — above the card -->
    <div class="action-area">
      <button class="btn-action" *ngIf="showButton" (click)="onActionButtonClick()">
        {{ buttonText }}
      </button>

      <div class="timer-block" *ngIf="!showButton">
        <span class="timer-label">Следующая карта через:</span>
        <span class="timer-value">{{ timer }}</span>
      </div>
    </div>

    <div class="card-wrapper" (click)="flipCard()">
      <div class="card" [class.show-face]="showCardFace">
        <!-- Back side (card back / рубашка) -->
        <div class="side back" [class.hidden]="showCardFace">
        </div>

        <!-- Face side — картинка спереди, предсказание сзади -->
        <div class="side face" [class.visible]="showCardFace">
          <!-- Image layer -->
          <div class="face-image-layer" [class.hidden]="showPrediction">
            <div class="card-image" [style.backgroundImage]="'url(' + card?.imageUrl + ')'"></div>
            <div class="card-name-bar">
              <span class="card-name">{{ card?.name }}</span>
            </div>
          </div>

          <!-- Prediction layer -->
          <div class="face-prediction-layer" [class.visible]="showPrediction">
            <p>{{ prediction?.text }}</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
