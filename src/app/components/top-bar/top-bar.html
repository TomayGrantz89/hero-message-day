<div class="top-bar">
  <!-- Home icon (left side) - hidden on home page -->
  <a *ngIf="showHomeIcon" routerLink="/" class="top-bar-home-link">
    <img src="assets/ui/arrow.png" alt="Home" class="top-bar-home-icon">
  </a>

  <!-- Spacer to push premium to the right -->
  <div class="top-bar-spacer"></div>

  <!-- Premium button/status (right side) -->
  <ng-container *ngIf="isPremium; else premiumButton">
    <span class="top-bar-premium-status">
      <img src="/assets/ui/star.png" alt="★" class="top-bar-premium-star" />
      Премиум-доступ
    </span>
  </ng-container>
  <ng-template #premiumButton>
    <button class="beautiful-button" (click)="purchasePremium()">
      Купить премиум
      <div class="hoverEffect">
        <div></div>
      </div>
    </button>
  </ng-template>
  <!-- <button class="button">
    Get in touch
    <div class="hoverEffect">
      <div></div>
    </div>
  </button> -->
</div>
