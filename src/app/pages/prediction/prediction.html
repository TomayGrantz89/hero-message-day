<div class="prediction-container">
  <main class="main">
    <p class="subtitle">{{ showCardFace ? (showPrediction ? '' : 'Нажмите на карту, чтобы узнать предсказание') : 'Нажмите на карту, чтобы открыть её' }}</p>

    <div class="card-wrapper" (click)="flipCard()">
      <div class="card" [class.flipped]="showCardFace">
        <!-- Back side (card back / рубашка) -->
        <div class="side back">
        </div>

        <!-- Face side — картинка спереди, предсказание сзади (внутренний флип) -->
        <div class="side face">
          <div class="card-inner" [class.show-prediction]="showPrediction">
            <!-- Front: картинка + имя -->
            <div class="card-front">
              <div class="card-image" [style.backgroundImage]="'url(' + card?.imageUrl + ')'"></div>
              <div class="card-name-bar">
                <span class="card-name">{{ card?.name }}</span>
              </div>
            </div>

            <!-- Back: предсказание -->
            <div class="prediction-back">
              <p>{{ prediction?.text }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Button section under the card -->
    <div class="button-section" *ngIf="showButton">
      <button class="btn-action" (click)="onActionButtonClick()">
        {{ buttonText }}
      </button>
      <div class="attempts-counter">
        Осталось попыток: <span class="attempt-count">{{ attemptsRemaining }}</span> / {{ maxAttemptsPerDay }}
      </div>
    </div>

    <!-- Timer: shown only when no attempts remaining and card is showing -->
    <p class="timer-line" *ngIf="attemptsRemaining <= 0 && showCardFace">
      Следующая карта через: <strong>{{ timer }}</strong>
    </p>
  </main>
</div>
