<div class="home-container">
  <!-- Premium status/button in top-right corner (fixed) -->
  <ng-container *ngIf="isPremium; else premiumButton">
    <span class="premium-status">
      <img src="assets/ui/star.png" alt="★" class="premium-star" />
      Премиум-доступ
    </span>
  </ng-container>
  <ng-template #premiumButton>
    <button class="premium-btn" (click)="purchasePremium()">
      <img src="assets/ui/star.png" alt="★" class="premium-icon" />
      <span>Купить премиум</span>
    </button>
  </ng-template>

  <h1>Карта дня</h1>
  <p>Получите предсказание на сегодня и собирайте коллекцию карт.</p>

  <div class="button-group">
    <a routerLink="/collection" class="btn btn-collection">
      Коллекция
    </a>
    <a routerLink="/prediction" class="btn btn-prediction">
      Получить предсказание
    </a>
    <a routerLink="/question" class="btn btn-question">
      Оракул
    </a>
  </div>

  <div *ngIf="!isPremium" class="info">
    <div>
      <p>Ежедневно вы можете получить одну карту бесплатно. Вторую — посмотрев рекламу.</p>
      <p>Доступно только 14 карт из 59.</p>
    </div>
  </div>
</div>
