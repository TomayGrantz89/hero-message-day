<div class="question-container">
  <div class="instruction-banner">
    <span class="instruction-text">{{ bannerText }}</span>
  </div>

  <div class="question-content">
    <!-- Left: Ask button -->
    <div class="button-section">
      <button class="ask-button" (click)="askQuestion()" [disabled]="!hasAttempt">
        <span class="ask-button-label">Спросить</span>
      </button>
    </div>

    <!-- Right: Character image -->
    <div class="character-section">
      <img src="assets/ui/cold.png" alt="Персонаж" class="character-image" />
    </div>
  </div>
</div>
